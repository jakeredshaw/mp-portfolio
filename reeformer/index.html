<script>
(function(){
  const R = REEF, C = REEF_CONTENT, CFG = REEF_CONFIG;
  const app = R.$("#app");
  let state = R.fromUrl();
  state.answers = state.answers || {};
  let idx = -1; // -1 = hero
  const hist = [];
  const A = () => state.answers;
  const steps = C.steps;
  const qCount = steps.filter(s => !["hook","capture"].includes(s.type)).length;

  function setProgress(){
    const wrap = R.$("#progwrap"), back = R.$("#back"), step = R.$("#qstep");
    const inQuiz = idx >= 0 && steps[idx] && !["capture", "hook"].includes(steps[idx].type);
    document.body.classList.toggle("inquiz", idx >= 0);
    if (idx < 0) { wrap.classList.add("hide"); back.style.visibility = "hidden"; step.textContent = ""; return; }
    wrap.classList.remove("hide"); back.style.visibility = hist.length ? "visible" : "hidden";
    const done = steps.slice(0, idx).filter(s => !["hook","capture"].includes(s.type)).length;
    const pct = Math.round(8 + (done / qCount) * 92);
    R.$("#prog").style.width = Math.min(100, pct) + "%";
    step.textContent = steps[idx].type === "capture" ? "" : (inQuiz ? (done + 1) : done) + " of " + qCount;
  }
  function go(i, push){ if (push !== false && idx >= 0) hist.push(idx); idx = i; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  function next(){ go(idx + 1); }
  R.$("#back").onclick = () => { if (hist.length) { idx = hist.pop(); render(); } };
  const save = () => R.save(state);

  function hero(){
    R.$("#foot").innerHTML = R.footer();
    app.innerHTML = `<section class="hero-img" style="min-height:min(78svh,660px)"><img src="assets/img/concept-studio.jpg" alt="Concept visual of the reef Reformer studio"><div class="in">
      <p class="eyebrow">Free quiz · About two minutes</p>
      <h1>Find your <em style="color:var(--gold-soft)">Pilates type</em>.</h1>
      <p style="font-size:16px;opacity:.95;max-width:46ch;margin:0 auto 22px">${qCount} easy questions about your body and your week, and we will show you where to start, how often to come, and what it costs.</p>
      <button class="btn btn-light btn-block" id="start" type="button" style="max-width:420px;margin:0 auto">Find my Pilates type</button>
      <p class="small" style="margin:14px 0 0;opacity:.85">Concept visual · 57 Wyle Cop, Shrewsbury</p></div></section>
      ${R.ticker()}
      <section class="hero" style="padding-top:28px">
      ${state.leadAt && state.answers && state.answers.ready ? `<div class="card" style="margin-bottom:18px;text-align:left"><p class="eyebrow" style="margin-bottom:6px">Welcome back${R.first(state.answers) ? ", " + R.esc(R.first(state.answers)) : ""}</p><p style="margin:0 0 12px">Your Reformer plan is saved.</p><div style="display:grid;gap:8px"><button class="btn btn-primary btn-block" id="seePlan" type="button">See my plan</button><button class="btn btn-ghost btn-block" id="redo" type="button">Start the quiz again</button></div></div>` : ""}
      <p class="eyebrow">Watch first · 45 seconds</p>
      ${R.vsl("quiz")}
      <div style="height:18px"></div>
      ${R.reassure()}
      <div class="htrust"><div><b>9</b>Reformer beds on Wyle Cop</div><div><b>5am</b>to 10pm, every single day</div><div><b>800+</b>Guided sessions on your own screen</div></div>
      <p class="small muted" style="margin-top:22px">A Reformer studio in the middle of Shrewsbury, opening ${R.esc(CFG.openingDateText)}.</p>
    </section>`;
    R.animate();
    const fresh = () => { const utm = state.utm; state = { answers: {}, utm }; R.save(state); };
    R.$("#start").onclick = () => { fresh(); R.track("QuizStart", {}, true); go(0, false); };
    if (R.$("#seePlan")) R.$("#seePlan").onclick = () => { idx = steps.length - 1; result(); scrollTo(0, 0); };
    if (R.$("#redo")) R.$("#redo").onclick = () => { fresh(); R.track("QuizRestart", {}, true); go(0, false); };
  }

  function render(){
    const rs = document.getElementById("rsticky"); if (rs) rs.remove();
    setProgress();
    if (idx < 0) return hero();
    R.$("#foot").innerHTML = "";
    const st = steps[idx];
    if (!st) return;
    const a = A();
    if (st.type === "hook") {
      const hk = C.hooks[st.id](a);
      const facts = (hk.facts || []).slice(0, hk.quiz ? 1 : 3).map((f, i) => `<div class="hf" style="animation-delay:${150 + i * 180}ms"><b>${R.esc(f[0])}</b><span>${R.esc(f[1])}</span>${f[2] ? `<em class="src">${R.esc(f[2])}</em>` : ""}</div>`).join("");
      const qz = hk.quiz ? `<div class="hq"><p class="hq-q">${R.esc(hk.quiz.q)}</p><div class="hq-opts">${hk.quiz.opts.map(o => `<button type="button" class="hq-o" data-o="${R.esc(o)}">${R.esc(o)}</button>`).join("")}</div><p class="hq-r" hidden>${R.esc(hk.quiz.reveal)}</p></div>` : "";
      app.innerHTML = `<div class="screen"><div class="hook"><div class="hb">
        <p class="eyebrow">${R.fill(hk.kicker, a)}</p><h2>${R.fill(hk.title, a)}</h2>${hk.line ? `<p class="hl">${R.fill(hk.line, a)}</p>` : ""}
        <div class="hfacts">${facts}</div>${qz}
      </div></div><div class="cta-row stick"><button class="btn btn-gold btn-block ready" id="nx" type="button">Keep going</button></div></div>`;
      app.querySelectorAll(".hq-o").forEach(b => b.onclick = () => {
        const ok = b.dataset.o === hk.quiz.answer;
        app.querySelectorAll(".hq-o").forEach(x => { x.disabled = true; x.classList.toggle("right", x.dataset.o === hk.quiz.answer); });
        if (!ok) b.classList.add("wrong");
        const r = app.querySelector(".hq-r"); r.hidden = false; r.textContent = (ok ? "Spot on! " : "Not quite. ") + hk.quiz.reveal;
        R.$("#nx").classList.add("pulse"); R.track("QuizGuess", { right: ok }, true);
        requestAnimationFrame(() => r.scrollIntoView({ behavior: "smooth", block: "center" }));
      });
      R.$("#nx").onclick = next; return;
    }
    if (st.type === "text") {
      app.innerHTML = `<div class="screen"><h2 class="q">${R.fill(st.q, a)}</h2>${st.help ? `<p class="help">${st.help}</p>` : ""}
        <input type="text" id="tx" autocomplete="given-name" placeholder="${st.placeholder}" value="${R.esc(a.name || "")}" maxlength="40">
        <div class="err" id="er"></div><div class="cta-row"><button class="btn btn-primary btn-block" id="nx" type="button">${st.cta}</button></div></div>`;
      const tx = R.$("#tx"); setTimeout(() => tx.focus(), 50);
      const sub = () => { const v = tx.value.trim(); if (v.length < 1) { R.$("#er").textContent = "Pop your first name in so we can personalise your plan."; return; } a.name = v; save(); next(); };
      R.$("#nx").onclick = sub; tx.onkeydown = e => { if (e.key === "Enter") sub(); }; return;
    }
    const ib = "";
    const Q = typeof st.q === "function" ? st.q(a) : st.q;
    const OPTS = st.optsFor ? st.optsFor(a) : st.opts;
    if (st.type === "single") {
      app.innerHTML = `<div class="screen">${ib}<h2 class="q">${R.fill(Q, a)}</h2>${st.help ? `<p class="help">${st.help}</p>` : ""}
        <div class="opts n${OPTS.length}">${OPTS.map(o => `<button class="opt ${a[st.id] === o[0] ? "sel" : ""}" data-v="${o[0]}" type="button">${o[2] ? `<span class="ic">${o[2]}</span>` : ""}<span>${o[1]}</span></button>`).join("")}</div></div>`;
      app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        app.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel");
        a[st.id] = b.dataset.v; save(); R.track("QuizAnswer", { q: st.id, a: b.dataset.v }, true); setTimeout(next, 220);
      }); return;
    }
    if (st.type === "multi") {
      const sel = new Set(a[st.id] || []);
      app.innerHTML = `<div class="screen"><h2 class="q">${R.fill(st.q, a)}</h2>${st.help ? `<p class="help">${st.help}</p>` : ""}
        <div class="opts n${st.opts.length}">${st.opts.map(o => `<button class="opt ${sel.has(o[0]) ? "sel" : ""}" data-v="${o[0]}" type="button"><span class="bx"></span><span>${o[1]}</span></button>`).join("")}</div>
        <div class="err" id="er"></div><div class="cta-row stick"><button class="btn btn-primary btn-block" id="nx" type="button">Continue</button></div></div>`;
      app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        const v = b.dataset.v;
        if (v === "none") { sel.clear(); sel.add("none"); } else { sel.delete("none"); sel.has(v) ? sel.delete(v) : sel.add(v); }
        app.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", sel.has(x.dataset.v)));
        const btn = R.$("#nx"); R.$("#er").textContent = "";
        btn.textContent = sel.size ? "Continue" : "Pick at least one";
        btn.classList.toggle("ready", !!sel.size);
      });
      R.$("#nx").classList.toggle("ready", !!sel.size);
      if (sel.size) R.$("#nx").textContent = "Continue";
      R.$("#nx").onclick = () => { if (!sel.size) { R.$("#er").textContent = "Choose at least one."; return; } a[st.id] = [...sel]; save(); next(); }; return;
    }
    if (st.type === "scale") {
      app.innerHTML = `<div class="screen"><h2 class="q">${R.fill(st.q, a)}</h2>${st.help ? `<p class="help">${st.help}</p>` : ""}
        <div class="scale">${[1,2,3,4,5].map(v => `<button class="${+a[st.id] === v ? "sel" : ""}" data-v="${v}" type="button" aria-label="${v} out of 5">${v}</button>`).join("")}</div>
        <div class="scale-l"><span>1 is ${st.lo.toLowerCase()}</span><span>5 is ${st.hi.toLowerCase()}</span></div>
        <p class="tapnote">Tap a number and we move on.</p></div>`;
      app.querySelectorAll(".scale button").forEach(b => b.onclick = () => { a[st.id] = b.dataset.v; save(); b.classList.add("sel"); setTimeout(next, 220); }); return;
    }
    if (st.type === "capture") return capture();
  }

  function capture(){
    const a = A(), rec = R.recommend(a);
    state.pack = rec.pack; save();
    const n = R.first(a);
    app.innerHTML = `<div class="screen">
      <p class="eyebrow">All done${n ? ", " + R.esc(n) : ""}</p>
      <h2 class="q">Your Reformer plan is ready.</h2>
      <p class="help">Tell us where to send it.</p>
      <div class="card cap-card"><ul class="ticks" style="margin:0">
        <li>What is actually going on with your body</li>
        <li>Your first twelve weeks, week by week</li>
        <li>The founder place that fits, and what it costs</li></ul></div>
      <label class="f" for="em">Your email address</label>
      <input type="email" id="em" autocomplete="email" inputmode="email" placeholder="you@example.com" value="${R.esc(state.email || "")}">
      <label class="chk chk-big"><input type="checkbox" id="sms"${state.sms ? " checked" : ""}> <span>Text me if places run low</span></label>
      <div id="phwrap"${state.sms ? "" : " hidden"}><label class="f" for="ph">Mobile number</label>
      <input type="tel" id="ph" autocomplete="tel" inputmode="tel" placeholder="07700 900123" value="${R.esc(state.phone || "")}"></div>
      <div class="err" id="er"></div>
      <div class="cta-row stick"><button class="btn btn-gold btn-block ready" id="nx" type="button">Show me my plan</button>
      <p class="cap-legal">We will email your plan and our founder news, you can unsubscribe in one click, and we never pass your details to anyone.</p></div>
    </div>`;
    R.$("#sms").onchange = (e) => { R.$("#phwrap").hidden = !e.target.checked; R.$("#er").textContent = ""; if (e.target.checked) setTimeout(() => R.$("#ph").focus(), 60); };
    R.$("#nx").onclick = async () => {
      const em = R.$("#em").value.trim(), sms = R.$("#sms").checked, ph = sms ? R.$("#ph").value.trim() : "";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { R.$("#er").textContent = "Please check your email address."; R.$("#em").focus(); return; }
      if (sms && !ph) { R.$("#er").textContent = "Pop your mobile in, or untick the box to skip it."; R.$("#ph").focus(); return; }
      if (sms && ph.replace(/\D/g, "").length < 10) { R.$("#er").textContent = "That mobile number looks a little short."; R.$("#ph").focus(); return; }
      state.email = em; state.phone = ph; state.sms = sms; state.leadAt = Date.now(); save();
      R.track("Lead", { content_name: C.packs[state.pack].name, value: C.packs[state.pack].price, currency: "GBP" });
      R.sendLead(state);
      analysing();
    };
  }

  function analysing(){
    document.body.classList.remove("inquiz");
    R.$("#progwrap").classList.add("hide"); R.$("#back").style.visibility = "hidden";
    R.$("#qstep").textContent = "";
    const a = A();
    const lines = ["Reading what you told us", "Lining it up against the research", "Working out your twelve weeks", "Finding the pack that fits"];
    app.innerHTML = `<div class="screen anal"><div class="ring"></div><h2 class="q">Building your plan, ${R.esc(R.first(a) || "friend")}…</h2><ul class="steps">${lines.map(l => `<li>${l}</li>`).join("")}</ul></div>`;
    const li = app.querySelectorAll(".steps li");
    li.forEach((el, i) => setTimeout(() => el.classList.add("done"), 380 * (i + 1)));
    setTimeout(result, 380 * lines.length + 300);
  }

  function result(){
    document.body.classList.remove("inquiz");
    R.$("#progwrap").classList.add("hide"); R.$("#back").style.visibility = "hidden"; R.$("#qstep").textContent = "";
    const a = A(), rec = R.recommend(a), prof = C.profiles[a.goal || "strength"];
    const pname = C.profileName(a), n = R.first(a), N = n ? R.esc(n) : "";
    const matched = rec.pack;
    let picked = matched;
    R.track("QuizComplete", { profile: pname, pack: C.packs[matched].name }, true);
    const sci = C.science[prof.science[0]];
    const bodyTxt = (a.body || []).filter(b => b !== "none").map(b => R.label("body", b).toLowerCase());
    const pains = [
      bodyTxt.length ? `Your <b>${bodyTxt.join(" and ")}</b> ${bodyTxt.length > 1 ? "are" : "is"} giving you trouble.` : `You feel good now, and you want to <b>keep it that way</b>.`,
      ({ desk: "You spend most of the day <b>sitting at a desk or driving</b>.", feet: "You're <b>on your feet all day</b>, so your body is tired but not trained.", rush: "You're <b>always rushing</b>, so your body never gets a proper reset.", parent: "You're <b>busy looking after everyone else</b>.", flex: "Your days are <b>flexible</b>, which is perfect for building a routine." })[a.day],
      +a.pace >= 4 ? `Your week is a <b>${a.pace} out of 5</b>. That's a lot to carry.` : "",
      a.metime === "cant" ? "You <b>can't remember</b> the last hour you had just for yourself." : ""
    ].filter(Boolean);
    const bm = C.barrierModules[a.barrier];

    /* ---------- the pack, decided for them ---------- */
    const sizeChip = (id) => {
      const X = C.packs[id], F = R.frame(id);
      const tag = id === matched ? `<span class="size-tag">Your match</span>` : id === "year" ? `<span class="size-tag alt">Best value</span>` : "";
      return `<button type="button" class="size ${id === picked ? "on" : ""}" data-id="${id}">${tag}
        <b>${F.per}</b><span>a class</span><em>${X.classes} classes</em><i>${R.money(X.price)}${X.perClassWellness || id === "year" ? " + recovery" : ""}</i></button>`;
    };
    const panel = (id) => {
      const P = C.packs[id], F = R.frame(id), why = R.reasons(a, id).slice(0, 2);
      const weekly = F.weekly.charAt(0).toUpperCase() + F.weekly.slice(1);
      return `<span class="badge ${id === matched ? "" : "foam"} pc-badge">${id === matched ? "Matched to your answers" : P.badge}</span>
        <h3 class="pc-name">${P.name}</h3>
        <p class="pc-tag">${P.tagline.replace(/\s*\u00a3[\d,]+\.?$/, ".").replace(/\.\.$/, ".")}</p>
        <div class="pc-money">
          <div class="pc-per"><b data-count="${P.perClass}">${F.per}</b><span>a class</span></div>
          <div class="pc-off">A single class is <b>${R.money(R.walkin)}</b> from opening day</div>
          <div class="pc-total"><b>${R.money(P.price)}</b> ${id === "year" ? "paid once, for" : "in total, for"} ${P.classes} classes${P.perClassWellness ? " and the recovery sessions" : ""}</div>
          <p class="pc-line">${weekly}${F.perDay ? `. That is about <b>${F.perDay} a day</b>` : F.perWeek ? `. That is about <b>${F.perWeek} a week</b>` : ""}.</p>
        </div>
        <ul class="ticks small pc-why">${why.map(r => `<li>${r}</li>`).join("")}</ul>
        <button class="btn btn-gold btn-block pulse" id="pickBuy" type="button">Start with ${P.name}, ${R.money(P.price)}</button>
        <p class="pc-re">Secure checkout, and you have your usual ${CFG.refundDays} days to change your mind. Your classes start on opening day.</p>
        <a class="pc-more" href="${P.file}?from=quiz">See everything in ${P.name}</a>`;
    };
    const cmpRow = (id) => {
      const X = C.packs[id], F = R.frame(id);
      const bits = X.stack.slice(0, 3).map(r => r[0]).join(" · ");
      return `<button type="button" class="cmp-row" data-id="${id}">
        <span class="cr-n">${X.name}<em>${bits}</em></span>
        <span class="cr-p"><b>${F.per}</b>a class<i>${R.money(X.price)} total</i></span></button>`;
    };

    app.innerHTML = `<div class="screen res">
      <div class="res-hd reveal"><div class="emo">${prof.emoji}</div><p class="eyebrow">Your Reformer profile</p>
      <h1 class="res-name">${N ? N + ", you're" : "You're"} <em>${pname}</em></h1>
      <p class="res-line">${prof.line}</p></div>

      <div class="card res-you"><p class="eyebrow">What you told us</p>
      <ul class="ticks" style="margin:0">${pains.map(p => `<li>${p}</li>`).join("")}</ul>
      <p class="res-why">${prof.why}</p></div>

      ${bm ? `<div class="card res-obj"><p class="eyebrow">And the bit that stopped you</p><h3>${bm.t}</h3><p>${R.fill(bm.b, a)}</p></div>` : ""}

      <section class="pickzone" id="pick">
        <p class="eyebrow">Your pack and your price</p>
        <h2 class="pick-h" id="pickH"></h2>
        <p class="pick-sub" id="pickSub"></p>
        <div class="pickcard" id="pickcard"></div>
        <p class="size-lab">Want a different size? Tap one and the price above changes</p>
        <div class="sizes" id="sizes">${C.order.map(sizeChip).join("")}</div>
        <div class="pick-guar">${R.guarantee(true)}</div>
      </section>

      <div class="planzone"><p class="eyebrow">Now the plan itself</p><h2 style="margin-top:2px">Your plan: <em>twice a week</em> for twelve weeks.</h2>
      <p class="muted">The NHS says adults should do something strengthening at least two days a week, and it names Pilates. Twice a week is also the dose the published studies used, so that is your plan.</p>
      <div class="wk">${C.weeks.map(w => `<div class="card"><b>${w[0]}</b><h3>${w[1]}</h3><p>${w[2]}</p></div>`).join("")}</div>

      <p class="eyebrow" style="margin-top:30px">Your first moves</p><h3>What you'll do in week one.</h3>
      ${R.moves()}
      </div>

      <div class="fact reveal" style="margin-top:30px"><b data-count="${parseFloat(sci[0]) || ""}">${sci[0]}</b><div><div>${sci[1]}</div><div class="src">${sci[2]}</div></div></div>
      <div style="margin-top:18px">${R.vsl("result")}</div>
      ${a.age && C.decadeModules[a.age] ? `<div class="card" style="margin-top:18px"><p class="eyebrow" style="margin-bottom:6px">Built for your ${R.esc(R.label("age", a.age))}</p><p style="margin:0">${C.decadeModules[a.age].b}</p></div>` : ""}

      <div class="center" style="margin-top:40px"><p class="eyebrow">All four founder packs</p><h2>What you get in each one.</h2>
      <p class="muted">Tap any pack to see its price up top.</p></div>
      <div class="cmp">${C.order.map(cmpRow).join("")}</div>
      <p class="center" style="margin-top:22px"><a href="packs.html?from=quiz">Open the full founder shop</a></p>
      <p class="center"><button class="link-quiet" id="retake" type="button">Retake the quiz</button></p>
    </div>`;
    R.$("#foot").innerHTML = R.footer();

    const stickState = () => {
      const st = R.$("#rsticky"), c = R.$("#pickcard");
      if (st && c) st.classList.toggle("show", c.getBoundingClientRect().bottom < 40);
    };
    const sticky = () => {
      let st = R.$("#rsticky");
      if (!st) {
        st = document.createElement("div"); st.id = "rsticky"; st.className = "sticky";
        document.body.appendChild(st);
        addEventListener("scroll", stickState, { passive: true });
      }
      return st;
    };
    const setPick = (id, scrollBack) => {
      picked = id;
      const P = C.packs[id], F = R.frame(id);
      R.$("#pickcard").innerHTML = panel(id);
      R.$("#pickcard").classList.toggle("is-match", id === matched);
      R.$("#pickH").innerHTML = id === matched
        ? `${N ? N + ", start" : "Start"} with <em>${P.name}</em>.`
        : `<em>${P.name}</em>, then.`;
      R.$("#pickSub").textContent = id === matched
        ? "We picked it from your answers, and here is exactly what it costs."
        : "Here is exactly what that one costs. Your match was " + C.packs[matched].name + ".";
      document.querySelectorAll(".size").forEach(s => s.classList.toggle("on", s.dataset.id === id));
      R.$("#pickBuy").onclick = () => R.addToBag(id);
      const st = sticky();
      st.innerHTML = `<div class="p"><b>${F.per} a class</b>${P.name} · ${R.money(P.price)} total</div><button class="btn btn-gold" type="button">Choose</button>`;
      st.querySelector("button").onclick = () => R.addToBag(id);
      stickState();
      if (scrollBack) { R.$("#pick").scrollIntoView({ behavior: "auto", block: "start" }); }
    };
    document.querySelectorAll(".size").forEach(b => b.onclick = () => { setPick(b.dataset.id); R.track("RecoSelect", { pack: b.dataset.id }, true); });
    document.querySelectorAll(".cmp-row").forEach(b => b.onclick = () => { setPick(b.dataset.id, true); R.track("RecoSelect", { pack: b.dataset.id, from: "compare" }, true); });
    setPick(matched);
    R.$("#retake").onclick = () => { const utm = state.utm; state = { answers: {}, utm }; R.save(state); const s = R.$("#rsticky"); if (s) s.remove(); idx = -1; hist.length = 0; render(); scrollTo({ top: 0, behavior: "auto" }); };
    R.animate();
  }

  if (CFG.testMode) R.$("#tb").innerHTML = `<div class="testbar">Test mode: leads are logged, payments simulated · <a href="lab.html">Open the Funnel Lab</a></div>`;
  const qp = new URLSearchParams(location.search);
  if (qp.has("restart")) { state = { answers: {}, utm: state.utm }; R.save(state); }
  // Funnel Lab / email links: ?r=CODE&view=result jumps straight to that result
  if (qp.get("view") === "result" && state.answers.ready) { idx = steps.length - 1; result(); }
  // refreshing always starts on the welcome screen (returning visitors get "See my plan" or "Start again")
  else render();
})();
</script>
</body>
</html>

</body></html>
